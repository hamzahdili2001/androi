name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: pip install buildozer "cython==0.29.36" virtualenv

      - name: Build
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          {
            echo "### First errors"
            echo '```'
            grep -n -i -E "command failed|error:|failed|traceback|exception" build.log | head -20
            echo '```'
            echo "### Last 30 lines"
            echo '```'
            tail -n 30 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$( { grep -n -i -E "command failed|error:|traceback" build.log | head -10; echo ----; tail -n 20 build.log; } \
                 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Build log summary::${msg}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: busmed-apk
          path: bin/*.apk



